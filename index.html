<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F7F5F1" />
    <title>Logo Remix Challenge</title>
    <script>
      // Apply the saved theme and holiday skin before first paint so neither flashes the plain light look (App.tsx keeps them in sync after).
      try {
        var s = localStorage.getItem('lrx-skin')
        // Auto follows the calendar; App.tsx caches what it resolved to, so the same skin comes back on the next load.
        if (s === 'auto' || s === null) s = localStorage.getItem('lrx-skin-active')
        if (s && s !== 'off') document.documentElement.dataset.skin = s
        var t = localStorage.getItem('lrx-theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#12100D')
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
